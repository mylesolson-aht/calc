<script>
    const discountSlider = document.getElementById('discountSlider');
    const discountValue = document.getElementById('discountValue');
    const discountHelperText = document.getElementById('discountHelperText');
    const cashDownError = document.getElementById('cashDownError');
    const principalAmountOutput = document.getElementById('principalAmount');
    const cashDownAmountOutput = document.getElementById('cashDownAmount');
    const remainingBalanceAmountOutput = document.getElementById('remainingBalanceAmount');
    const monthlyPaymentsContainer = document.getElementById('monthlyPayments');
    const totalInterestPaidContainer = document.getElementById('totalInterestPaid');
    const cashOutTotalOutput = document.getElementById('cashOutTotal');
    const cashResultsSection = document.getElementById('cashResults');
    const financingResultsSection = document.getElementById('financingResults');
    const upgradeOfferContainer = document.getElementById('upgradeOfferContainer');
    const upgradeOfferText = document.getElementById('upgradeOfferText');
    const upgradeOffer = document.getElementById('upgradeOffer');
    const toggleInterestButton = document.getElementById('toggleInterestButton');
    const termSlider = document.getElementById('termSlider');
    const termValueDisplay = document.getElementById('termValueDisplay');
    const termMaxLabel = document.getElementById('termMaxLabel');
    const termLabelsContainer = document.getElementById('termLabels');
    const penaltyContainer = document.getElementById('penaltyContainer');
    const initialAmountSlider = document.getElementById('initialAmountSlider');
    const initialAmountValue = document.getElementById('initialAmountValue');
    const sliderMinLabel = document.getElementById('sliderMinLabel');
    const sliderMaxLabel = document.getElementById('sliderMaxLabel');

    const interestRate = 0.1799;
    const planPrices = { 'legacy': 4999, '10year': 2999, '3year': 999 };
    const ABSOLUTE_MIN = { '3year': 99, '10year': 199, 'legacy': 299 };
    const PLAN_TERMS = { 'legacy': 36, '10year': 24, '3year': 12 };

    const UPGRADE_PATHS = {
        '3year': { name: '10 Year', price: 2999, nextPlan: '10year' },
        '10year': { name: 'Legacy', price: 4999, nextPlan: 'legacy' }
    };

    function pmt(rate, nper, pv) {
        if (rate === 0) return pv / nper;
        const pvif = Math.pow(1 + rate, nper);
        return (rate * pv * pvif) / (pvif - 1);
    }

    function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(Math.round(amount));
    }

    function getMaxDiscount(plan, isCashOut = false) {
        if (plan === '3year') return 0;
        if (plan === 'legacy') return 1000;
        if (plan === '10year') {
            return isCashOut ? 750 : 1000;   // Cash out max 750, financing/buyback max 1000
        }
        return 1000;
    }

    function getMinDeposit(principal, plan) {
        if (principal <= 0) return ABSOLUTE_MIN[plan];
        const tenPercent = principal * 0.10;
        const calculatedMin = Math.ceil(tenPercent) - 1;
        return Math.max(calculatedMin, ABSOLUTE_MIN[plan]);
    }

    function updateDiscountUI(plan) {
        if (plan === '3year') {
            discountSlider.disabled = true;
            discountSlider.value = 0;
            discountValue.textContent = '$0';
            discountValue.classList.add('text-gray-400');
            discountHelperText.textContent = 'No discount available on Trial 3 Year plan';
        } else {
            discountSlider.disabled = false;
            discountValue.classList.remove('text-gray-400');
            discountHelperText.textContent = plan === 'legacy' 
                ? 'Max $1,000 total (10% cash + $500 buyback)' 
                : 'Max $750 cash out • Max $1,000 buyback';
        }
    }

    function updateInitialSlider(principal, plan) {
        const minDep = getMinDeposit(principal, plan);
        initialAmountSlider.min = minDep;
        initialAmountSlider.max = principal;
        initialAmountSlider.value = Math.max(minDep, Math.min(initialAmountSlider.value, principal));
        initialAmountValue.textContent = '$' + initialAmountSlider.value;
        sliderMinLabel.textContent = '$' + minDep;
        sliderMaxLabel.textContent = '$' + principal;
    }

    function calculate() {
        const activeTile = document.querySelector('.input-tile.active');
        const plan = activeTile.dataset.plan;
        let requestedDiscount = plan === '3year' ? 0 : parseInt(discountSlider.value) || 0;

        const isCashOutMode = parseFloat(initialAmountSlider.value) >= (planPrices[plan] - requestedDiscount);

        // Enforce plan-specific max discount
        const maxAllowed = getMaxDiscount(plan, isCashOutMode);
        let discount = Math.min(requestedDiscount, maxAllowed);

        // Sync slider if we had to reduce it
        if (discount !== requestedDiscount) {
            discountSlider.value = discount;
        }

        const principal = Math.max(0, planPrices[plan] - discount);
        const minDeposit = getMinDeposit(principal, plan);
        let cashDown = parseFloat(initialAmountSlider.value) || minDeposit;
        cashDown = Math.max(minDeposit, Math.min(cashDown, principal));

        initialAmountSlider.value = cashDown;
        initialAmountValue.textContent = '$' + cashDown;

        principalAmountOutput.textContent = formatCurrency(principal);
        cashDownAmountOutput.textContent = formatCurrency(cashDown);
        remainingBalanceAmountOutput.textContent = formatCurrency(principal - cashDown);

        discountValue.textContent = '$' + discount;

        if (cashDown >= principal) {
            // === CASH OUT ===
            cashResultsSection.classList.remove('hidden');
            financingResultsSection.classList.add('hidden');
            upgradeOfferContainer.classList.add('hidden');
            cashOutTotalOutput.textContent = formatCurrency(cashDown);
        } else {
            // === FINANCING ===
            cashResultsSection.classList.add('hidden');
            financingResultsSection.classList.remove('hidden');

            const remaining = principal - cashDown;
            const monthlyRate = interestRate / 12;
            const currentTerm = parseInt(termSlider.value);
            const payment = pmt(monthlyRate, currentTerm, remaining);

            monthlyPaymentsContainer.innerHTML = `
                <div class="result-card">
                    <p class="text-sm text-gray-500 mb-1">${currentTerm} Months</p>
                    <p class="text-5xl font-bold text-blue-600">${formatCurrency(payment)}</p>
                    <p class="text-xs text-gray-400 mt-1">per month</p>
                </div>
            `;

            showPenalty(plan, currentTerm);

            const totalInterest = (payment * currentTerm) - remaining;
            const totalCost = cashDown + (payment * currentTerm);

            totalInterestPaidContainer.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-4 bg-gray-50 rounded-xl text-center">
                        <p class="text-xs text-gray-500">Total Interest</p>
                        <p class="text-2xl font-semibold">${formatCurrency(totalInterest)}</p>
                    </div>
                    <div class="p-4 bg-gray-50 rounded-xl text-center">
                        <p class="text-xs text-gray-500">Total Cost</p>
                        <p class="text-2xl font-semibold">${formatCurrency(totalCost)}</p>
                    </div>
                </div>
            `;

            // Upgrade offer
            const upgradeInfo = UPGRADE_PATHS[plan];
            upgradeOfferContainer.classList.toggle('hidden', !upgradeInfo);
            if (upgradeInfo) {
                // ... (upgrade logic unchanged - let me know if you want it adjusted too)
            }
        }
    }

    // Rest of your functions (updateTermUI, showPenalty, handlePlanChange, etc.) remain the same
    function updateTermUI(plan) {
        if (plan === 'legacy') {
            termSlider.max = 36;
            termSlider.value = 36;
            termMaxLabel.textContent = '36';
            termLabelsContainer.innerHTML = `<span>6</span><span>12</span><span>18</span><span>24</span><span>36</span>`;
        } else {
            termSlider.max = 24;
            termSlider.value = (plan === '10year') ? 24 : 12;
            termMaxLabel.textContent = '24';
            termLabelsContainer.innerHTML = `<span>6</span><span>12</span><span>18</span><span>24</span>`;
        }
        updateTermDisplay();
    }

    function updateTermDisplay() {
        termValueDisplay.textContent = termSlider.value + " Months";
    }

    function showPenalty(plan, term) {
        penaltyContainer.classList.add('hidden');
        if (plan !== '3year') return;
        let message = '', color = '';
        if (term === 18) { message = '25% commission penalty applied'; color = 'text-amber-600'; }
        else if (term === 24) { message = '35% commission penalty applied'; color = 'text-red-600'; }
        if (message) {
            penaltyContainer.innerHTML = `<p class="${color} font-medium">${message}</p>`;
            penaltyContainer.classList.remove('hidden');
        }
    }

    function handlePlanChange(tile) {
        document.querySelectorAll('.input-tile').forEach(t => t.classList.remove('active'));
        tile.classList.add('active');
        const plan = tile.dataset.plan;
        updateTermUI(plan);
        updateDiscountUI(plan);
        calculate();
    }

    // Event Listeners
    document.querySelectorAll('[data-plan]').forEach(tile => tile.addEventListener('click', () => handlePlanChange(tile)));

    discountSlider.addEventListener('input', () => {
        if (!discountSlider.disabled) calculate();
    });

    initialAmountSlider.addEventListener('input', () => {
        initialAmountValue.textContent = '$' + initialAmountSlider.value;
        calculate();
    });

    termSlider.addEventListener('input', () => {
        updateTermDisplay();
        calculate();
    });

    // Toggle interest details
    let detailsVisible = false;
    toggleInterestButton.addEventListener('click', () => {
        detailsVisible = !detailsVisible;
        totalInterestPaidContainer.classList.toggle('hidden', !detailsVisible);
        toggleInterestButton.innerHTML = detailsVisible
            ? `👁 <span class="text-xs">Hide Details</span>`
            : `👁 <span class="text-xs">Show Details</span>`;
    });

    document.addEventListener('DOMContentLoaded', () => {
        handlePlanChange(document.querySelector('[data-plan="legacy"]'));
    });
</script>

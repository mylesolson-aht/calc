<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Travel Program Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui; background: #f5f5f7; }
        .tile { padding: 16px; background: white; border: 2px solid #ddd; border-radius: 12px; text-align: center; cursor: pointer; }
        .tile.active { border-color: #007aff; background: #007aff; color: white; }
    </style>
</head>
<body class="p-6 max-w-md mx-auto">

    <h1 class="text-3xl font-bold text-center mb-8">Wholesale Travel Calculator</h1>

    <!-- Plan Selection -->
    <div class="grid grid-cols-3 gap-3 mb-8">
        <div class="tile active" data-plan="legacy">Legacy</div>
        <div class="tile" data-plan="10year">10 Year</div>
        <div class="tile" data-plan="3year">3 Year</div>
    </div>

    <!-- Discount -->
    <div class="mb-6">
        <div class="flex justify-between mb-2">
            <span>Discount</span>
            <span id="discountValue" class="font-bold text-blue-600">$0</span>
        </div>
        <input type="range" id="discountSlider" min="0" max="1000" step="50" value="0" class="w-full accent-blue-600">
    </div>

    <!-- Initial Amount -->
    <div>
        <div class="flex justify-between mb-2">
            <span>Initial Amount</span>
            <span id="initialAmountValue" class="font-bold text-blue-600">$499</span>
        </div>
        <input type="range" id="initialAmountSlider" min="99" max="4999" step="1" value="499" class="w-full accent-blue-600">
        <div class="flex justify-between text-xs text-gray-500 mt-1">
            <span id="minLabel">$499</span>
            <span id="maxLabel">$4,999</span>
        </div>
    </div>

    <script>
        const discountSlider = document.getElementById('discountSlider');
        const initialSlider = document.getElementById('initialAmountSlider');
        const initialValue = document.getElementById('initialAmountValue');
        const minLabel = document.getElementById('minLabel');
        const maxLabel = document.getElementById('maxLabel');
        const discountValue = document.getElementById('discountValue');

        const prices = { legacy: 4999, '10year': 2999, '3year': 999 };

        function getDefaultInitial(principal) {
            if (principal <= 0) return 99;
            return Math.max(Math.ceil(principal * 0.10) - 1, 99);
        }

        function calculate() {
            const plan = document.querySelector('.tile.active').dataset.plan;
            let discount = Number(discountSlider.value);
            if (plan === '3year') discount = Math.min(discount, 100);

            const principal = Math.max(0, prices[plan] - discount);

            discountValue.textContent = '$' + discount;

            // === THIS IS THE KEY PART ===
            const defaultInitial = getDefaultInitial(principal);

            // Auto-set the initial amount
            initialSlider.min = defaultInitial;
            initialSlider.max = principal;
            initialSlider.value = defaultInitial;

            initialValue.textContent = '$' + defaultInitial;
            minLabel.textContent = '$' + defaultInitial;
            maxLabel.textContent = '$' + principal;
        }

        // Click on plans
        document.querySelectorAll('.tile').forEach(tile => {
            tile.addEventListener('click', () => {
                document.querySelectorAll('.tile').forEach(t => t.classList.remove('active'));
                tile.classList.add('active');
                discountSlider.value = 0;
                calculate();
            });
        });

        discountSlider.addEventListener('input', calculate);
        initialSlider.addEventListener('input', () => {
            initialValue.textContent = '$' + initialSlider.value;
        });

        // Start
        calculate();
    </script>
</body>
</html>

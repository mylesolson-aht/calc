<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesale Travel Program Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-8">
    <div class="bg-white p-5 sm:p-8 rounded-2xl container-shadow w-full max-w-lg mx-auto">
        <!-- Your existing HTML structure remains the same -->
        <!-- ... -->

        <script>
            // ====================== CONSTANTS ======================
            const interestRate = 0.1799;
            const planPrices = { 'legacy': 4999, '10year': 2999, '3year': 999 };
            const FLOOR_INITIAL = { '3year': 99, '10year': 299, 'legacy': 499 };
            const PLAN_TERMS = { 'legacy': 36, '10year': 24, '3year': 12 };
            const UPGRADE_PATHS = {
                '3year': { name: '10 Year', price: 2999, nextPlan: '10year' },
                '10year': { name: 'Legacy', price: 4999, nextPlan: 'legacy' }
            };
            const PLAN_DISPLAY = { 'legacy': 'Legacy', '10year': '10 Year', '3year': 'Trial' };

            // ====================== HELPERS ======================
            function pmt(rate, nper, pv) {
                if (rate === 0) return pv / nper;
                const pvif = Math.pow(1 + rate, nper);
                return (rate * pv * pvif) / (pvif - 1);
            }

            function formatCurrency(amount) {
                return new Intl.NumberFormat('en-US', { 
                    style: 'currency', 
                    currency: 'USD', 
                    maximumFractionDigits: 0 
                }).format(Math.round(amount));
            }

            /** NEW / FIXED: Auto-adjust to 10% of current principal - 1 */
            function getDefaultInitialAmount(principal, plan) {
                if (principal <= 0) return FLOOR_INITIAL[plan];
                
                const tenPercent = principal * 0.10;
                let calculated = Math.ceil(tenPercent) - 1;
                
                // Respect plan minimum
                return Math.max(calculated, FLOOR_INITIAL[plan]);
            }

            // ====================== UI UPDATE FUNCTIONS ======================
            function updateBuybackSliderMax(plan) {
                let maxBuyback = plan === '3year' ? 100 : 1000;
                discountSlider.max = maxBuyback;
                buybackMaxLabel.textContent = '$' + maxBuyback;
                if (parseInt(discountSlider.value) > maxBuyback) discountSlider.value = maxBuyback;
            }

            function updateDiscountUI(plan) {
                if (plan === '3year') {
                    discountSlider.disabled = true;
                    discountSlider.value = 0;
                    discountValue.textContent = '$0';
                    discountValue.classList.add('text-gray-400');
                    discountHelperText.textContent = 'No discount available on Trial 3 Year plan';
                } else {
                    discountSlider.disabled = false;
                    discountValue.classList.remove('text-gray-400');
                    updateBuybackSliderMax(plan);
                    discountHelperText.textContent = plan === 'legacy'
                        ? 'Max $1,000 buyback'
                        : 'Max $750 cash out • Max $1,000 buyback';
                }
            }

            function updateInitialSlider(plan, principal) {
                const defaultInitial = getDefaultInitialAmount(principal, plan);
                
                initialAmountSlider.min = defaultInitial;
                initialAmountSlider.max = principal;
                initialAmountSlider.value = defaultInitial;
                
                initialAmountValue.textContent = '$' + defaultInitial;
                sliderMinLabel.textContent = '$' + defaultInitial;
                sliderMaxLabel.textContent = '$' + principal;
            }

            // ====================== MAIN CALCULATE ======================
            function calculate() {
                const activeTile = document.querySelector('.input-tile.active');
                const plan = activeTile.dataset.plan;
                const basePrice = planPrices[plan];
                let buyback = parseInt(discountSlider.value) || 0;
                if (plan === '3year') buyback = Math.min(buyback, 100);

                const principal = Math.max(0, basePrice - buyback);
                discountValue.textContent = '$' + buyback;

                // === AUTO-ADJUST INITIAL AMOUNT ===
                const defaultInitial = getDefaultInitialAmount(principal, plan);
                let cashDown = defaultInitial;

                // Only allow manual override if user moved the slider themselves
                if (parseInt(initialAmountSlider.value) !== defaultInitial && 
                    initialAmountSlider.value !== initialAmountSlider.dataset.lastAuto) {
                    cashDown = parseInt(initialAmountSlider.value);
                }

                initialAmountSlider.dataset.lastAuto = defaultInitial; // track auto value
                initialAmountSlider.value = cashDown;
                initialAmountValue.textContent = '$' + cashDown;

                updateInitialSlider(plan, principal);

                principalAmountOutput.textContent = formatCurrency(principal);
                cashDownAmountOutput.textContent = formatCurrency(cashDown);

                // Rest of your calculation logic (cash out vs financing, monthly payments, upgrade offer, etc.)
                if (cashDown >= principal - 0.01) {
                    // Cash out flow...
                    cashResultsSection.classList.remove('hidden');
                    financingResultsSection.classList.add('hidden');
                    upgradeOfferContainer.classList.add('hidden');
                    cashOutTotalOutput.textContent = formatCurrency(cashDown);
                    // ... (rest of cash out code)
                } else {
                    // Financing flow...
                    // ... (your existing financing code)
                }
            }

            // ====================== EVENT LISTENERS ======================
            // (Your existing listeners stay the same, just make sure quickSetInitial calls calculate())

            function quickSetInitial(action) {
                // ... existing code
                calculate();
            }

            // Init
            document.addEventListener('DOMContentLoaded', () => {
                handlePlanChange(document.querySelector('[data-plan="legacy"]'));
            });
        </script>
    </div>
</body>
</html>
